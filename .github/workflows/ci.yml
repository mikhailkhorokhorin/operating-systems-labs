name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make ci
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/
          if-no-files-found: ignore
